      <g id="neck-spines" fill="#7DAA2D">
        <path d="M85 109Q97 102 94 116L84 155Q82 167 73 161L45 143Q36 137 46 131Z" />
        <path d="M64 181Q78 173 75 187L65 229Q63 241 54 234L27 211Q17 203 29 197Z" />
      </g>
