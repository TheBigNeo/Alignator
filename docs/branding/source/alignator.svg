        <ellipse id="nostril" cx="534" cy="128" rx="15" ry="9" />
        <path id="eyebrow" d="M177 92C184 70 207 57 229 70" fill="none" stroke="#111315" stroke-width="10" stroke-linecap="round" />
        <path id="smile" d="M249 174C263 188 280 191 304 191H538" fill="none" stroke="#111315" stroke-width="10" stroke-linecap="round" />
        <path id="tooth-1" d="M393 191L405 212Q411 223 417 212L429 191Z" />
        <path id="tooth-2" d="M439 191L451 212Q457 223 463 212L475 191Z" />
        <path id="tooth-3" d="M485 191L497 212Q503 223 509 212L521 191Z" />
      </g>
