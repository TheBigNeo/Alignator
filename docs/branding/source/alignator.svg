        <rect x="28" y="295" width="235" height="30" rx="15" />
        <rect x="78" y="363" width="185" height="30" rx="15" />
        <rect x="28" y="431" width="235" height="30" rx="15" />
        <rect x="102" y="497" width="161" height="30" rx="15" />
      </g>
      <g id="aligned-code" fill="#7DAA2D">
        <rect id="divider" x="281" y="260" width="26" height="267" rx="13" />
        <rect x="324" y="295" width="246" height="30" rx="15" />
        <rect x="324" y="363" width="246" height="30" rx="15" />
        <rect x="324" y="431" width="246" height="30" rx="15" />
        <rect x="324" y="497" width="246" height="30" rx="15" />
      </g>
    </g>
