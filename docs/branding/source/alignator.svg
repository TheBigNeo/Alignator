<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 600 600" role="img" aria-labelledby="title desc">
  <title id="title">Alignator</title>
  <desc id="desc">A friendly green alligator with a nose, a round eye and three teeth above four aligned code rows.</desc>
